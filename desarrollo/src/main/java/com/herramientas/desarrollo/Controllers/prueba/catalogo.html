<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Productos - GamingStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://kit.fontawesome.com/da157044bb.js"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        background: linear-gradient(135deg, #0f0f1f, #1a082d, #000);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
      }
      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .card-glow:hover {
        box-shadow: 0 0 30px rgba(186, 85, 255, 0.8),
          0 0 60px rgba(138, 43, 226, 0.6);
        transform: scale(1.05) rotate3d(1, 1, 0, 5deg);
        transition: all 0.4s ease;
      }

      .price-gradient {
        background: linear-gradient(90deg, #a855f7, #ec4899, #9333ea, #a855f7);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
      }
      @keyframes shine {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }

      .offer-badge {
        position: absolute;
        top: 10px;
        right: -20px;
        transform: rotate(15deg);
        background: linear-gradient(to right, #ff0080, #7928ca);
        padding: 6px 20px;
        font-size: 0.8rem;
        font-weight: bold;
        color: #fff;
        border-radius: 8px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: rotate(15deg) scale(1);
        }
        50% {
          opacity: 0.7;
          transform: rotate(15deg) scale(1.1);
        }
      }

      .btn-neon {
        background: linear-gradient(to right, #6a11cb, #2575fc);
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        color: #fff;
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .btn-neon:hover {
        box-shadow: 0 0 20px #9333ea, 0 0 40px #a855f7;
        transform: scale(1.05);
      }
    </style>
  </head>

  <body class="text-white min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="Componentes/NavBar :: nav_bar"></div>

    <!-- HEADER -->
    <header class="text-center py-20 relative mt-16">
      <h1
        class="text-5xl md:text-6xl font-extrabold text-purple-400 drop-shadow-lg"
      >
        Catálogo de Productos
      </h1>
      <p class="mt-4 text-gray-300">Explora lo mejor en tecnología gamer</p>
    </header>

    <!-- GRID DE PRODUCTOS -->
    <main
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 px-6 md:px-16 flex-grow"
    >
      <!-- CARD 1 -->
      <div
        class="bg-gray-900 rounded-2xl shadow-lg overflow-hidden relative card-glow"
      >
        <div class="offer-badge">-10%</div>
        <img
          src="https://m.media-amazon.com/images/I/61D0Xz2v4UL._AC_SL1500_.jpg"
          class="w-full h-56 object-contain bg-black"
        />
        <div class="p-6">
          <h2 class="text-2xl font-bold text-purple-300 mt-3">
            Razer DeathAdder V2
          </h2>
          <p class="text-gray-300 mt-2">
            Sensor óptico Focus+, switches mecánicos Razer.
          </p>
          <div class="flex justify-between items-center mt-5">
            <span class="text-xl font-extrabold price-gradient">S/.259.00</span>
            <button class="btn-neon" onclick="verDetalle(1)">
              Ver Detalles
            </button>
          </div>
        </div>
      </div>

      <!-- CARD 2 -->
      <div
        class="bg-gray-900 rounded-2xl shadow-lg overflow-hidden relative card-glow"
      >
        <img
          src="https://m.media-amazon.com/images/I/71P8fU+uRRL.AC_SL1500.jpg"
          class="w-full h-56 object-contain bg-black"
        />
        <div class="p-6">
          <h2 class="text-2xl font-bold text-purple-300 mt-3">
            Logitech G502 HERO
          </h2>
          <p class="text-gray-300 mt-2">Peso ajustable, sensor HERO 25K.</p>
          <div class="flex justify-between items-center mt-5">
            <span class="text-xl font-extrabold price-gradient">S/.329.00</span>
            <button class="btn-neon" onclick="verDetalle(2)">
              Ver Detalles
            </button>
          </div>
        </div>
      </div>

      <!-- CARD 3 -->
      <div
        class="bg-gray-900 rounded-2xl shadow-lg overflow-hidden relative card-glow"
      >
        <div class="offer-badge">-5%</div>
        <img
          src="https://m.media-amazon.com/images/I/71sDLX1w7mL.AC_SL1500.jpg"
          class="w-full h-56 object-contain bg-black"
        />
        <div class="p-6">
          <h2 class="text-2xl font-bold text-purple-300 mt-3">
            HyperX Pulsefire Surge
          </h2>
          <p class="text-gray-300 mt-2">RGB y precisión de 16000 DPI.</p>
          <div class="flex justify-between items-center mt-5">
            <span class="text-xl font-extrabold price-gradient">S/.299.90</span>
            <button class="btn-neon" onclick="verDetalle(3)">
              Ver Detalles
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer th:replace="Componentes/Footer :: footer"></footer>

    <!-- Script redirección -->
    <script>
      function verDetalle(id) {
        // Redirige a la página de detalle con el ID del producto
        window.location.href = Detalle-producto.html?id=${id};
      }
    </script>
  </body>
</html>
