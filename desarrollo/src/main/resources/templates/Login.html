<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Futurista Gamer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/da157044bb.js" crossorigin="anonymous"></script>
  <style>
    /* 🌌 Fondo con gradiente animado morado + negro */
    body {
      background: linear-gradient(270deg, #0a0a0a, #1c1c1c, #4c1d95, #0a0a0a);
      background-size: 800% 800%;
      animation: gradientMove 15s ease infinite;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 🌀 Avatar flotante 3D */
    .avatar {
      transition: transform 0.5s ease;
    }
    .avatar:hover {
      transform: rotateY(15deg) rotateX(10deg) scale(1.15);
    }

    /* 🎮 Botón con gradiente animado morado-oscuro */
    .btn-animate {
      background: linear-gradient(270deg, #4c1d95, #1c1c1c, #6d28d9, #0a0a0a);
      background-size: 600% 600%;
      animation: gradientShift 8s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen relative overflow-hidden">
  
  <!-- ✨ Esferas brillantes difuminadas -->
  <div class="absolute w-96 h-96 bg-purple-800 rounded-full blur-3xl opacity-30 top-10 left-10 animate-pulse"></div>
  <div class="absolute w-72 h-72 bg-purple-600 rounded-full blur-3xl opacity-20 bottom-20 right-20 animate-pulse"></div>

  <!-- 🪟 Contenedor con glassmorphism -->
  <div class="relative z-10 bg-white/10 backdrop-blur-xl shadow-2xl rounded-2xl p-8 w-full max-w-md text-white border border-white/20 animate-fade-in">
    
    <!-- 👤 Avatar flotante -->
    <div class="flex justify-center">
      <img src="https://i.ibb.co/ypBk6Lr/avatar.png" alt="Avatar" 
           class="avatar w-24 h-24 rounded-full border-4 border-purple-500 shadow-lg">
    </div>

    <!-- Título -->
    <h2 class="text-3xl font-bold text-center mt-4 mb-6">Bienvenido a <span class="text-purple-400">OSCssA</span></h2>

    <!-- Formulario -->
    <form action="/sesion" method="POST" class="space-y-4">
      <!-- Usuario -->
      <div>
        <label class="block text-sm text-gray-200">Usuario</label>
        <div class="relative">
          <input type="text" placeholder="Ingresa su usuario" required
            class="w-full pl-10 pr-4 py-2 rounded-lg bg-white/20 border border-white/30 focus:ring-2 focus:ring-purple-400 focus:outline-none">
          <i class="fa-solid fa-user absolute left-3 top-3 text-gray-300"></i>
        </div>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-sm text-gray-200">Contraseña</label>
        <div class="relative">
          <input type="password" placeholder="Ingresa tu contraseña" required
            class="w-full pl-10 pr-4 py-2 rounded-lg bg-white/20 border border-white/30 focus:ring-2 focus:ring-purple-400 focus:outline-none">
          <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-300"></i>
        </div>
      </div>

      <!-- Recuperar -->
      <div class="text-right" >
        <a href="#" class="text-sm text-purple-300 hover:underline">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón LOGIN -->
<a th:href="@{/inicioAdmin}" class="btn-animate w-full py-2 rounded-lg text-white font-semibold hover:scale-105 transition" style="width: 100%">
  login
</a>
    </form>
    <!-- Redes sociales -->
    <div class="mt-6">
      <p class="text-center text-gray-300 text-sm">O inicia sesión con</p>
      <div class="flex justify-center gap-6 mt-4">
        <a href="#" class="text-2xl hover:scale-125 transition text-blue-500"><i class="fab fa-facebook"></i></a>
        <a href="#" class="text-2xl hover:scale-125 transition text-red-500"><i class="fab fa-google"></i></a>
        <a href="#" class="text-2xl hover:scale-125 transition text-gray-200"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </div>
</body>
</html>
