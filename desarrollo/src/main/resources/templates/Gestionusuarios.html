<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gestión de Productos</title>
      <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Gestión de Usuarios</title>

    <style>
      :root {
        --bg-1: #0f0c13;
        --bg-2: #1b0f2b;
        --accent-1: #9a4dff;
        --accent-2: #6f2dbd;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: #fff;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      header {
        background: rgba(154, 77, 255, 0.15);
        padding: 1rem 2rem;
        width: 100%;
        text-align: center;
        font-size: 1.8rem;
        color: var(--accent-1);
        border-bottom: 2px solid rgba(154, 77, 255, 0.3);
      }

      .container {
        background: rgba(111, 45, 189, 0.08);
        padding: 2rem;
        border-radius: 15px;
        margin-top: 2rem;
        width: 90%;
        max-width: 800px;
        box-shadow: 0 0 15px rgba(154, 77, 255, 0.3);
      }

      h2 {
        color: var(--accent-1);
        border-bottom: 1px solid rgba(154, 77, 255, 0.3);
        padding-bottom: 5px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }

      th,
      td {
        border-bottom: 1px solid rgba(154, 77, 255, 0.3);
        padding: 0.7rem;
        text-align: center;
      }

      button {
        background: var(--accent-1);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 0.5rem 0.8rem;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: var(--accent-2);
      }
    </style>
  </head>
  <body>
  <div th:replace="Componentes/navbarAdmin :: nav_barAdm"></div>
    <header>Gestión de Usuarios</header>
    <div class="container">
      <h2>Lista de Usuarios</h2>
      <table id="userTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      const users = [
        { id: 1, name: "Carlos", role: "Admin", active: true },
        { id: 2, name: "Lucía", role: "Cliente", active: false },
      ];

      function renderUsers() {
        const tbody = document.querySelector("#userTable tbody");
        tbody.innerHTML = "";
        users.forEach((u) => {
          tbody.innerHTML += `
          <tr>
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.role}</td>
            <td>${u.active ? "Activo" : "Inactivo"}</td>
            <td>
              <button onclick="toggleUser(${u.id})">
                ${u.active ? "Desactivar" : "Activar"}
              </button>
            </td>
          </tr>`;
        });
      }

      function toggleUser(id) {
        const user = users.find((u) => u.id === id);
        user.active = !user.active;
        renderUsers();
      }

      renderUsers();
    </script>
  </body>
</html>
