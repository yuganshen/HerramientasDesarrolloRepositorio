<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles del Producto - GamingStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f0f1f, #1a082d, #000);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      color: white;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-neon {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      border: none;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .btn-neon:hover {
      box-shadow: 0 0 20px #9333ea, 0 0 40px #a855f7;
      transform: scale(1.05);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-6 py-16">

  <!-- ✅ Navbar -->
  <div th:replace="Componentes/NavBar :: nav_bar"></div>

  <div id="detalle" class="bg-gray-900 rounded-2xl p-8 shadow-2xl w-full max-w-4xl text-center"></div>

  <!-- ✅ Footer -->
  <footer th:replace="Componentes/Footer :: footer"></footer>

  <script th:inline="javascript">

    const producto = productos.find(p => p.id === productoId);

    if (producto) {
      document.getElementById("detalle").innerHTML = `
        <img src="${producto.imagen}" class="w-full h-80 object-contain mb-6 rounded-xl bg-black p-4">
        <h1 class="text-4xl font-bold text-purple-400 mb-2">${producto.nombre}</h1>
        <p class="text-gray-300 mb-4">${producto.descripcion}</p>
        <h3 class="text-2xl font-semibold text-pink-400 mb-4">${producto.precio}</h3>

        <ul class="text-gray-300 text-left mb-6 space-y-2 max-w-md mx-auto">
          ${producto.especificaciones.map(e => `<li>• ${e}</li>`).join('')}

        <a href="/catalogo" class="btn-neon px-6 py-2 rounded-lg">⬅ Volver al Catálogo</a>

    } else {
      document.getElementById("detalle").innerHTML = `<p class='text-red-400'>Producto no encontrado.</p>`;

</body>
</html>
