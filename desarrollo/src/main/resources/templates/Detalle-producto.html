    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #0f0f1f, #1a082d, #000);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        color: white;
      }
      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .btn-neon {
        background: linear-gradient(to right, #6a11cb, #2575fc);
        border: none;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
        color: white;
        font-weight: bold;
      }
      .btn-neon:hover {
        box-shadow: 0 0 20px #9333ea, 0 0 40px #a855f7;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-center px-6 py-16">
  
        <div th:replace="Componentes/navbar :: nav_bar"></div>
  
    <!-- ✅ Navbar -->

      // ✅ Mostrar datos
      if (producto) {
        document.getElementById("detalle").innerHTML = `
        <img src="${

          producto.nombre
        }</h1>

          producto.precio
        }</h3>
        <ul class="text-gray-300 text-left mb-6 space-y-2 max-w-md mx-auto">
          ${producto.especificaciones.map((e) => `<li>• ${e}</li>`).join("")}

      } else {
        document.getElementById(
          "detalle"
        ).innerHTML = `<p class='text-red-400 text-xl font-bold'>Producto no encontrado.</p>`;
      }

  </body>
</html>
