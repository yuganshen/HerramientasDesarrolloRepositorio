<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito de Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans">

  <!-- HEADER -->
  <header class="flex justify-between items-center p-6 bg-zinc-900 shadow-lg">
    <h1 class="text-2xl font-bold text-blue-400">TechStore</h1>
    <div class="relative">
      <!-- Icono carrito -->
      <button class="relative">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.6 8h13.2L17 13M7 13h10">
          </path>
        </svg>
        <span id="cart-count"
          class="absolute -top-2 -right-2 bg-blue-500 text-xs rounded-full px-2 py-0.5">2</span>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-5xl mx-auto p-6">
    <h2 class="text-3xl font-semibold mb-6 text-blue-400">Tu Carrito</h2>

    <!-- Lista de productos -->
    <div class="grid gap-6">
      <!-- Producto -->
      <div class="flex items-center justify-between bg-zinc-800 p-4 rounded-2xl shadow-md">
        <div class="flex items-center gap-4">
          <img src="https://via.placeholder.com/100" class="w-20 h-20 rounded-xl" alt="Producto 1" />
          <div>
            <h3 class="text-lg font-bold">Laptop Gamer</h3>
            <p class="text-sm text-gray-400">Potente y moderna</p>
          </div>
        </div>
        <div class="flex items-center gap-6">
          <span class="text-blue-400 font-bold text-lg">$1200</span>
          <input type="number" value="1" min="1" class="w-16 text-black p-1 rounded" />
          <button class="text-red-400 hover:text-red-600">✕</button>
        </div>
      </div>

      <!-- Producto -->
      <div class="flex items-center justify-between bg-zinc-800 p-4 rounded-2xl shadow-md">
        <div class="flex items-center gap-4">
          <img src="https://via.placeholder.com/100" class="w-20 h-20 rounded-xl" alt="Producto 2" />
          <div>
            <h3 class="text-lg font-bold">Mouse Inalámbrico</h3>
            <p class="text-sm text-gray-400">Ergonómico y preciso</p>
          </div>
        </div>
        <div class="flex items-center gap-6">
          <span class="text-blue-400 font-bold text-lg">$40</span>
          <input type="number" value="2" min="1" class="w-16 text-black p-1 rounded" />
          <button class="text-red-400 hover:text-red-600">✕</button>
        </div>
      </div>
    </div>

    <!-- TOTAL -->
    <div class="mt-10 flex justify-between items-center bg-zinc-900 p-6 rounded-2xl shadow-lg">
      <h3 class="text-xl font-semibold">Total:</h3>
      <span class="text-2xl font-bold text-blue-400">$1280</span>
    </div>

    <!-- Botón de pago -->
    <div class="mt-6 text-right">
      <button
        class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-2xl shadow-lg font-semibold transition">
        Proceder al Pago
      </button>
    </div>
  </main>

</body>
</html>
