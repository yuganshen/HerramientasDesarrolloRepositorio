<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ofertas Especiales</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
      color: #333;
    }

    header {
      background: #e63946;
      color: white;
      text-align: center;
      padding: 1.5em 0;
    }

    header h1 {
      margin: 0;
      font-size: 2.5em;
    }

    .contenedor {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .oferta {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 15px;
      text-align: center;
      transition: transform 0.2s ease-in-out;
    }

    .oferta:hover {
      transform: scale(1.05);
    }

    .oferta img {
      max-width: 100%;
      border-radius: 8px;
    }

    .oferta h3 {
      margin: 10px 0;
      font-size: 1.3em;
      color: #e63946;
    }

    .precio {
      font-size: 1.2em;
      font-weight: bold;
      color: #2a9d8f;
    }

    .boton {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #e63946;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .boton:hover {
      background: #d62828;
    }

    footer {
      text-align: center;
      background: #222;
      color: white;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔥 Ofertas Especiales 🔥</h1>
    <p>Aprovecha los descuentos limitados por tiempo</p>
  </header>

  <section class="contenedor">
    <div class="oferta">
      <img src="https://via.placeholder.com/250x150" alt="Producto 1">
      <h3>Producto 1</h3>
      <p class="precio">Antes: $50 <br> Ahora: $30</p>
      <a href="#" class="boton">Comprar ahora</a>
    </div>

    <div class="oferta">
      <img src="https://via.placeholder.com/250x150" alt="Producto 2">
      <h3>Producto 2</h3>
      <p class="precio">Antes: $80 <br> Ahora: $55</p>
      <a href="#" class="boton">Comprar ahora</a>
    </div>

    <div class="oferta">
      <img src="https://via.placeholder.com/250x150" alt="Producto 3">
      <h3>Producto 3</h3>
      <p class="precio">Antes: $120 <br> Ahora: $90</p>
      <a href="#" class="boton">Comprar ahora</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Tienda Virtual - Todos los derechos reservados</p>
  </footer>

</body>
</html>
