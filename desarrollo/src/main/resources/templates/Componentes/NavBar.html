<div th:fragment="nav_bar">
  <!-- NAVBAR -->
  <nav 
     class="bg-gradient-to-r from-blue-900 to-black p-4 px-8 flex justify-between items-center text-white fixed top-0 left-0 w-full shadow-lg z-50">
  
  <!-- Logo -->
  <a href="/" class="text-yellow-400 font-bold text-xl">
    🕹️ GamingStore
  </a>

  <!-- Links -->
  <div class="flex gap-6">
    <a href="/" class="hover:text-yellow-400 transition">Inicio</a>
    <a href="/catalogo" class="hover:text-yellow-400 transition">Catálogo</a>
    <a href="/cart" class="hover:text-yellow-400 transition">Carrito (0)</a>
  </div>
</nav>

  <!-- CONTENEDOR DE PESTAÑAS -->
  <div class="max-w-6xl mx-auto mt-24 px-4">
    <div class="flex gap-4 border-b-2 border-gray-300 mb-4">
      <button class="tab-button px-4 py-2 font-semibold border-b-4 border-transparent hover:text-yellow-400 transition" data-tab="laptops">Laptops</button>
      <button class="tab-button px-4 py-2 font-semibold border-b-4 border-transparent hover:text-yellow-400 transition" data-tab="computadoras">Computadoras</button>
      <button class="tab-button px-4 py-2 font-semibold border-b-4 border-transparent hover:text-yellow-400 transition" data-tab="zona-gamer">Zona Gamer</button>
      <button class="tab-button px-4 py-2 font-semibold border-b-4 border-transparent hover:text-yellow-400 transition" data-tab="partes-pc">Partes de PC</button>
      <button class="tab-button px-4 py-2 font-semibold border-b-4 border-transparent hover:text-yellow-400 transition" data-tab="monitores">Monitores y más</button>
      <button class="tab-button px-4 py-2 font-semibold border-b-4 border-transparent hover:text-yellow-400 transition" data-tab="impresoras">Impresoras</button>
    </div>

    <!-- Ejemplo de contenido de pestaña -->
    <div id="laptops" class="tab-content hidden animate-fadeInUp">
      <h2 class="text-xl font-bold mb-2">Laptops</h2>
      <div class="flex flex-wrap gap-3 mb-4">
        <a href="/laptops/asus" class="bg-blue-900 text-white px-4 py-2 rounded-lg hover:bg-yellow-400 hover:text-black transition">Asus</a>
        <a href="/laptops/hp" class="bg-blue-900 text-white px-4 py-2 rounded-lg hover:bg-yellow-400 hover:text-black transition">HP</a>
        <a href="/laptops/lenovo" class="bg-blue-900 text-white px-4 py-2 rounded-lg hover:bg-yellow-400 hover:text-black transition">Lenovo</a>
        <a href="/laptops/dell" class="bg-blue-900 text-white px-4 py-2 rounded-lg hover:bg-yellow-400 hover:text-black transition">Dell</a>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    const tabs = document.querySelectorAll('.tab-button');
    const contents = document.querySelectorAll('.tab-content');
    let activeTab = null;

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const tabId = tab.getAttribute('data-tab');
        const content = document.getElementById(tabId);

        if (activeTab === tab) {
          tab.classList.remove('text-yellow-400', 'border-yellow-400');
          content.classList.add('hidden');
          activeTab = null;
        } else {
          tabs.forEach(t => t.classList.remove('text-yellow-400', 'border-yellow-400'));
          contents.forEach(c => c.classList.add('hidden'));

          tab.classList.add('text-yellow-400', 'border-yellow-400');
          content.classList.remove('hidden');
          activeTab = tab;
        }
      });
    });
  </script>
  </div>
